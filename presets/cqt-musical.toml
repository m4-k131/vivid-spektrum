# CQT musical profile — constant-Q transform for musical analysis
# Bins align exactly with musical pitches (12 bins/octave = semitones).
# Great for seeing chords, melody lines, and harmonic structure.
# Usage: cargo run --bin hyprgram -- --config presets/cqt-musical.toml

[spectrum]
window_size = 8192
hop_size = 512
sample_rate = 48000
log_bins = 512
f_min_hz = 27.5
f_max_hz = 16744.0
db_floor = -80.0
db_ceil = 0.0
window_fn = "blackman-harris"
band_aggregation = "triangular"
freq_smoothing_sigma = 0.3
amplitude_gamma = 0.5
temporal_alpha = 0.2
peak_hold_decay = 0.88
transform = "cqt"
cqt_bins_per_octave = 24
freq_scale_exp = 0.5

[image]
width = 900
height = 300
scroll_right_to_left = true
colormap = "catppuccin-mocha"
