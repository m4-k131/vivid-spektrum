# Personal default — balanced quality with tuned display range
# Based on default profile with:
#   - f_max lowered to 12 kHz (removes empty top region with exp=0.5)
#   - log_bins raised to 2048 (sharper frequency axis)
#   - freq_smoothing_sigma raised to 1.5 (less blocky)
#   - taller window (400px) to actually use the extra bins
# Usage: cargo run --bin vividspektrum -- --config presets/personal.toml --contrast 1.2 --saturation 1.1

[spectrum]
window_size = 8192
hop_size = 1024
sample_rate = 48000
log_bins = 4096
f_min_hz = 20.0
f_max_hz = 15000.0
db_floor = -90.0
db_ceil = -10.0
window_fn = "blackman-harris"
band_aggregation = "triangular"
freq_smoothing_sigma = 1.1
amplitude_gamma = 0.4
temporal_alpha = 0.6
peak_hold_decay = 0.95
freq_scale_exp = 0.6

[image]
width = 800
height = 1440
scroll_right_to_left = true
colormap = "nebula"
contrast = 1.2
saturation = 1.1
