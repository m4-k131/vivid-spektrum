# High-resolution profile — maximum quality, high CPU
# Very high resolution, heavy smoothing, fast refresh.
# Usage: cargo run --bin vividspektrum -- --config presets/high-resolution.toml

[spectrum]
window_size = 32768
hop_size = 128
sample_rate = 48000
log_bins = 2048
f_min_hz = 20.0
f_max_hz = 20000.0
db_floor = -100.0
db_ceil = 0.0
window_fn = "blackman-harris"
band_aggregation = "triangular"
freq_smoothing_sigma = 1.5
amplitude_gamma = 0.4
temporal_alpha = 0.4
peak_hold_decay = 0.95
freq_scale_exp = 0.5

[image]
width = 1200
height = 400
scroll_right_to_left = true
colormap = "inferno"
