# Ultra-responsive profile — minimum latency, maximum temporal resolution
# Small FFT window = less frequency detail but near-instant response.
# Good for beat detection, transient-heavy music, live performance.
# Usage: cargo run --bin hyprgram -- --config presets/ultra-responsive.toml

[spectrum]
window_size = 2048
hop_size = 128
sample_rate = 48000
log_bins = 512
f_min_hz = 30.0
f_max_hz = 20000.0
db_floor = -75.0
db_ceil = 0.0
window_fn = "hann"
band_aggregation = "triangular"
freq_smoothing_sigma = 0.3
amplitude_gamma = 0.6
temporal_alpha = 0.05
peak_hold_decay = 0.6
freq_scale_exp = 0.5

[image]
width = 800
height = 200
scroll_right_to_left = true
colormap = "plasma"
