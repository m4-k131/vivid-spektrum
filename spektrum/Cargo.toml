[package]
name = "spektrum"
version = "0.4.0"
edition.workspace = true
license.workspace = true
default-run = "vividspektrum"

[[bin]]
name = "vividspektrum"
path = "src/main.rs"

[[bin]]
name = "kde_overlay"
path = "src/bin/kde_overlay.rs"
required-features = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
spektrum-core = { path = "../spektrum-core" }

[target.'cfg(target_os = "linux")'.dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
iced = { version = "0.14", default-features = false, features = ["wgpu", "wayland", "tokio"] }
iced_layershell = { version = "0.14.2", default-features = false, features = ["wgpu"] }

[target.'cfg(target_os = "windows")'.dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
