name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  actions: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Package
        run: |
          mkdir -p vividspektrum-linux
          cp target/release/vividspektrum vividspektrum-linux/
          cp target/release/kde_overlay vividspektrum-linux/
          cp -r colormaps overlays vividspektrum-linux/ || true
          tar czf vividspektrum-linux-x86_64.tar.gz vividspektrum-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vividspektrum-linux-x86_64
          path: vividspektrum-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bin vividspektrum

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vividspektrum-windows
          Copy-Item target\release\vividspektrum.exe vividspektrum-windows\vividspektrum.exe
          Copy-Item -Recurse -Path colormaps,overlays -Destination vividspektrum-windows -ErrorAction SilentlyContinue
          Compress-Archive -Path vividspektrum-windows -DestinationPath vividspektrum-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vividspektrum-windows-x86_64
          path: vividspektrum-windows-x86_64.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vividspektrum-linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: vividspektrum-windows-x86_64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vividspektrum-linux-x86_64.tar.gz
            vividspektrum-windows-x86_64.zip
          generate_release_notes: ${{ github.event_name == 'push' }}
